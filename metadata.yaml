name: astrbot_plugin_thinking_effort
display_name: 思考强度（一条指令换档）
author: zhiq2793-art
description: >
  改所有 provider 的 reasoning_effort（思考强度）。
  四档跟 DeepSeek 原生对齐：off / low / high / max。
  两种方式：
  1. 聊天里发 /思考 关 —— 一条指令换档
  2. 面板的插件配置里选一档 —— 保存后重启即可
  改完都提示重启实例，重启后生效。
  v2.0.1 修了跨实例移植后「/思考 读成 不认识 [MSG_ID:...]」的问题——
  解析参数前先把平台注入的方括号标记抹掉。
version: 2.0.3
repo: ""
